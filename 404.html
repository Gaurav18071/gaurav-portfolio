<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Page Not Found | Gaurav Mishra</title>
    <meta name="description" content="Oops! This page doesn't exist. Head back to Gaurav Mishra's portfolio.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="./manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Portfolio CSS -->
    <link rel="stylesheet" href="css/bundle.css">
</head>

<body>

    <!-- Custom Cursor -->
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" aria-hidden="true"></div>

    <!-- Header (minimal) -->
    <header class="header scrolled" role="banner">
        <nav class="nav container" aria-label="Main navigation">
            <a href="/" class="logo" aria-label="Gaurav Mishra Home">
                G<span>A</span>UR<span>A</span>V
            </a>
            <a href="/" class="btn btn-primary" style="padding: 10px 24px; font-size: 0.9rem;">
                <i class="fas fa-house" aria-hidden="true"></i>
                Back Home
            </a>
        </nav>
    </header>

    <!-- 404 Content -->
    <main id="main-content">
        <section class="notfound-section">
            <div class="notfound-content">

                <!-- Animated 404 Number -->
                <div class="notfound-code" aria-label="Error 404">404</div>

                <h1 class="notfound-title">Oops! Page Not Found</h1>

                <p class="notfound-desc">
                    The page you're looking for doesn't exist or has been moved.<br>
                    Let's get you back on track.
                </p>

                <div class="notfound-actions">
                    <a href="/" class="btn btn-primary">
                        <i class="fas fa-house" aria-hidden="true"></i>
                        Go Home
                    </a>
                    <a href="/#contact" class="btn btn-outline">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        Contact Me
                    </a>
                </div>

                <!-- Quick nav links -->
                <div style="margin-top: 48px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                    <a href="/#about" style="color: var(--clr-text-light); font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='var(--clr-primary)'" onmouseout="this.style.color='var(--clr-text-light)'">About</a>
                    <a href="/#skills" style="color: var(--clr-text-light); font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='var(--clr-primary)'" onmouseout="this.style.color='var(--clr-text-light)'">Skills</a>
                    <a href="/#projects" style="color: var(--clr-text-light); font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='var(--clr-primary)'" onmouseout="this.style.color='var(--clr-text-light)'">Projects</a>
                    <a href="/#experience" style="color: var(--clr-text-light); font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='var(--clr-primary)'" onmouseout="this.style.color='var(--clr-text-light)'">Experience</a>
                    <a href="/#hire" style="color: var(--clr-text-light); font-size: 0.9rem; transition: color 0.2s;" onmouseover="this.style.color='var(--clr-primary)'" onmouseout="this.style.color='var(--clr-text-light)'">Hire Me</a>
                </div>

            </div>
        </section>
    </main>

    <script src="js/app.min.js" defer></script>

</body>

</html>
